<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380" style="background:#090d16;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b14"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="60%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><radialGradient id="radialCyan" cx="20%" cy="25%" r="45%"><stop offset="0%" stop-color="#0ea5e9" stop-opacity=".25"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient><radialGradient id="radialPurple" cx="80%" cy="75%" r="50%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".22"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><filter id="glowFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="subtleGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-18px) scale(1.2);opacity:.8}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.04)}}@keyframes dataFlow{0%{stroke-dashoffset:240}}@keyframes badgePulse{0%{border-color:rgba(99,102,241,.4);box-shadow:0 0 10px rgba(99,102,241,.2)}50%{border-color:rgba(56,189,248,.8);box-shadow:0 0 20px rgba(56,189,248,.4)}}.particle-1{animation:floatParticle 6s ease-in-out infinite}.particle-2{animation:floatParticle 8s ease-in-out infinite 1.5s}.particle-3{animation:floatParticle 7s ease-in-out infinite 3s}.particle-4{animation:floatParticle 9s ease-in-out infinite 4.5s}.stream-line{stroke-dasharray:12 18;animation:dataFlow 12s linear infinite}.radar-sweep,.radar-sweep-rev{animation:rotateRadar 14s linear infinite;transform-origin:1040px 100px}.radar-sweep-rev{animation:rotateRadar 20s linear infinite reverse}</style></defs><rect width="1200" height="380" fill="url(#bgGrad)"/><rect width="1200" height="380" fill="url(#radialCyan)"/><rect width="1200" height="380" fill="url(#radialPurple)"/><g stroke="#334155" stroke-opacity=".18" stroke-width="1"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="220" y2="220"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="120" x2="120" y1="0" y2="380"/><line x1="300" x2="300" y1="0" y2="380"/><line x1="500" x2="500" y1="0" y2="380"/><line x1="700" x2="700" y1="0" y2="380"/><line x1="900" x2="900" y1="0" y2="380"/><line x1="1080" x2="1080" y1="0" y2="380"/></g><g fill="none" stroke-width="1.8"><path stroke="#38bdf8" stroke-opacity=".35" d="M 60,320 L 220,320 L 280,260 L 520,260 L 580,320 L 860,320 L 920,260 L 1140,260" class="stream-line"/><path stroke="#a855f7" stroke-opacity=".3" d="M 80,70 L 240,70 L 300,120 L 540,120 L 600,70 L 880,70 L 940,130 L 1120,130" class="stream-line" style="animation-direction:reverse"/></g><g opacity=".35"><circle cx="1040" cy="100" r="70" fill="none" stroke="#6366f1" stroke-opacity=".4" stroke-width="1.2"/><circle cx="1040" cy="100" r="45" fill="none" stroke="#38bdf8" stroke-opacity=".5" strok