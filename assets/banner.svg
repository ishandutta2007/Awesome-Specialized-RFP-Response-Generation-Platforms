<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="radialCyan" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="radialPurple" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Dynamic Animations */
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-18px) scale(1.2); opacity: 0.8; }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.04); }
      }

      @keyframes dataFlow {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes badgePulse {
        0%, 100% { border-color: rgba(99, 102, 241, 0.4); box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }
        50% { border-color: rgba(56, 189, 248, 0.8); box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
      }

      @keyframes rotateRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 3s; }
      .particle-4 { animation: floatParticle 9s ease-in-out infinite 4.5s; }

      .glow-pulse { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .stream-line { stroke-dasharray: 12 18; animation: dataFlow 12s linear infinite; }
      .radar-sweep { animation: rotateRadar 14s linear infinite; transform-origin: 1040px 100px; }
      .radar-sweep-rev { animation: rotateRadar 20s linear infinite reverse; transform-origin: 1040px 100px; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" fill="url(#radialCyan)"/>
  <rect width="1200" height="380" fill="url(#radialPurple)"/>

  <!-- Subtle Blueprint / Grid Lines in Background -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
    <line x1="700" y1="0" x2="700" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
    <line x1="1080" y1="0" x2="1080" y2="380"/>
  </g>

  <!-- Dynamic Circuit / Pipeline Network in Background -->
  <g fill="none" stroke-width="1.8">
    <!-- Pipeline Flow 1 -->
    <path d="M 60,320 L 220,320 L 280,260 L 520,260 L 580,320 L 860,320 L 920,260 L 1140,260" stroke="#38bdf8" stroke-opacity="0.35" class="stream-line"/>
    <!-- Pipeline Flow 2 -->
    <path d="M 80,70 L 240,70 L 300,120 L 540,120 L 600,70 L 880,70 L 940,130 L 1120,130" stroke="#a855f7" stroke-opacity="0.3" class="stream-line" style="animation-direction: reverse;"/>
  </g>

  <!-- Dynamic Radar / Abstract AI Node Hub (Right side background) -->
  <g opacity="0.35">
    <circle cx="1040" cy="100" r="70" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="1040" cy="100" r="45" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="1040" cy="100" r="22" fill="#6366f1" fill-opacity="0.2"/>
    <line x1="970" y1="100" x2="1110" y2="100" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" class="radar-sweep"/>
    <line x1="1040" y1="30" x2="1040" y2="170" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 4" class="radar-sweep-rev"/>
  </g>

  <!-- Ambient Glowing Particles (Kept in Background, Low Opacity) -->
  <circle cx="180" cy="90" r="4" fill="#38bdf8" class="particle-1" filter="url(#subtleGlow)"/>
  <circle cx="420" cy="280" r="5" fill="#a855f7" class="particle-2" filter="url(#subtleGlow)"/>
  <circle cx="760" cy="95" r="3.5" fill="#38bdf8" class="particle-3" filter="url(#subtleGlow)"/>
  <circle cx="940" cy="310" r="4.5" fill="#6366f1" class="particle-4" filter="url(#subtleGlow)"/>
  <circle cx="1110" cy="190" r="3" fill="#38bdf8" class="particle-1" filter="url(#subtleGlow)"/>

  <!-- Top Decorative Border with Gradient Accent -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#primaryGlow)"/>

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Top Category Chip / Tagline -->
  <g transform="translate(80, 52)">
    <rect x="0" y="0" width="310" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4.5" fill="#10b981" filter="url(#subtleGlow)"/>
    <text x="28" y="20" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM &amp; BENCHMARK</text>
  </g>

  <!-- Main Title: Crystal Clear, High Contrast, Guaranteed Foreground -->
  <g transform="translate(80, 130)">
    <!-- Subtle drop shadow rect for contrast enhancement -->
    <text x="0" y="0" fill="#ffffff" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#glowFilter)" opacity="0.4">
      Specialized RFP Response Generation
    </text>
    <text x="0" y="0" fill="url(#textGrad)" font-size="40" font-weight="800" letter-spacing="-0.5">
      Specialized RFP Response Generation
    </text>
    <text x="0" y="46" fill="#38bdf8" font-size="34" font-weight="800" letter-spacing="-0.3">
      Platforms &amp; AI Proposal Automation
    </text>
  </g>

  <!-- Subtitle Text -->
  <g transform="translate(80, 222)">
    <text x="0" y="0" fill="#94a3b8" font-size="16" font-weight="400" letter-spacing="0.2">
      An enterprise directory of SaaS category leaders, self-hosted RAG architectures,
    </text>
    <text x="0" y="24" fill="#cbd5e1" font-size="15" font-weight="500" letter-spacing="0.1">
      and autonomous agentic pipelines for questionnaires, bids, RFIs, and DDQs.
    </text>
  </g>

  <!-- Feature Pillar Pills in Foreground -->
  <g transform="translate(80, 290)">
    <!-- Pill 1: SaaS Market Leaders -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1.2"/>
      <text x="18" y="26" font-size="14">🏢</text>
      <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">Enterprise SaaS Leaders</text>
    </g>

    <!-- Pill 2: Open-Source & Self-Hosted -->
    <g transform="translate(238, 0)">
      <rect x="0" y="0" width="245" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2"/>
      <text x="18" y="26" font-size="14">💻</text>
      <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">Self-Hosted RAG &amp; Agents</text>
    </g>

    <!-- Pill 3: Compliance & Security -->
    <g transform="translate(501, 0)">
      <rect x="0" y="0" width="250" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.2"/>
      <text x="18" y="26" font-size="14">🛡️</text>
      <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">DDQ, SIG &amp; SOC2 Assurance</text>
    </g>

    <!-- Pill 4: Transparent Pricing -->
    <g transform="translate(769, 0)">
      <rect x="0" y="0" width="230" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.2"/>
      <text x="18" y="26" font-size="14">📊</text>
      <text x="44" y="26" fill="#f8fafc" font-size="13" font-weight="600">Pricing &amp; Valuation Tiers</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Bar -->
  <rect x="0" y="375" width="1200" height="5" fill="url(#primaryGlow)"/>
</svg>
